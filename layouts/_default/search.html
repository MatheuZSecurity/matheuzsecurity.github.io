{{- define "main" }}

<header class="page-head">
  <h1><span class="prompt">$</span> grep -ri</h1>
  {{- with .Description }}<div class="desc">{{ . }}</div>{{ end }}
</header>

<div id="searchbox">
  <input id="searchInput" autofocus placeholder="{{ .Params.placeholder | default "type to search the archive ..." }}"
    aria-label="search" type="search" autocomplete="off" spellcheck="false" maxlength="80">
  <ul id="searchResults" aria-label="search results"></ul>
</div>

{{- end }}
