<span class="social-icons">
    {{- range site.Params.socialIcons }}
    <a href="{{ trim .url " " | safeURL }}" target="_blank" rel="noopener noreferrer me" title="{{ (.title | default .name) | title }}" aria-label="{{ (.title | default .name) | title }}">
        {{- partial "svg.html" . -}}
    </a>
    {{- end }}
</span>
