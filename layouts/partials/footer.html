<footer class="foot">
    <span>
        {{- if site.Copyright }}{{ site.Copyright | markdownify }}
        {{- else }}&copy; {{ now.Year }} <a href="{{ "" | relLangURL }}">{{ site.Title }}</a>{{ end -}}
    </span>
    <span>built with <a href="https://gohugo.io/" target="_blank" rel="noopener">hugo</a> · handcrafted layouts</span>
</footer>

{{- if (and (eq .Kind "page") (ne .Layout "search") (.Param "ShowCodeCopyButtons")) }}
<script>
document.querySelectorAll('pre > code').forEach((code) => {
    const pre = code.parentNode;
    const wrap = pre.parentNode;
    const btn = document.createElement('button');
    btn.className = 'copy-code';
    btn.type = 'button';
    btn.textContent = 'copy';
    const done = () => { btn.textContent = 'copied'; setTimeout(() => btn.textContent = 'copy', 1600); };
    btn.addEventListener('click', () => {
        navigator.clipboard.writeText(code.textContent).then(done).catch(() => {});
    });
    const host = wrap.classList.contains('highlight') ? wrap : pre;
    host.style.position = 'relative';
    host.appendChild(btn);
});
</script>
{{- end }}
